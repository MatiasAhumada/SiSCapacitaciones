name: Deploy staging frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: front
    steps:
      - name: Check out staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -- --no-fix

      - name: Build staging frontend
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        run: |
          test -n "$VITE_APP_URL" || { echo 'Configure VITE_APP_URL in GitHub Environment staging.' >&2; exit 1; }
          npm run build:staging
          node scripts/verify-build-api-url.mjs dist

      - name: Render isolated staging Nginx config
        working-directory: .
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GIT_SHA: ${{ github.sha }}
        run: |
          test -n "$FRONTEND_URL" || { echo 'Configure FRONTEND_URL in GitHub Environment staging.' >&2; exit 1; }
          mkdir -p ops/nginx
          node ops/scripts/render-staging-nginx.mjs ops/nginx/siscapacitaciones-staging.conf.template ops/nginx/siscapacitaciones-staging.conf "$FRONTEND_URL" "$VITE_APP_URL" "$GIT_SHA"

      - name: Install password-based SSH client
        working-directory: .
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes sshpass
          fi

      - name: Publish isolated staging release and validate Nginx/HTTP
        working-directory: .
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GIT_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash ops/scripts/deploy-staging-frontend.sh

      - name: Record deployment identity
        if: success()
        run: |
          echo "Environment: staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
