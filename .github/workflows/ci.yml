name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: back
            directory: back
          - project: front
            directory: front
          - project: titulos
            directory: titulos

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build production frontend configuration
        if: matrix.project == 'front'
        env:
          VITE_APP_URL: https://siscapacitaciones.net/backend
        run: |
          npm run build:production
          node scripts/verify-build-api-url.mjs dist
